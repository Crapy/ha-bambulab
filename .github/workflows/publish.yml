name: Publish

on:
  release:
    types:
      - published
  push:
    branches:
      - release/v2.2.26.post2

concurrency:
  group: publish-${{ github.event.release.tag_name || 'v2.2.26.post2' }}
  cancel-in-progress: false

jobs:
  release_zip_file:
    name: Run automations to build latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name || 'v2.2.26.post2' }}
      PATCH_RELEASE_NOTES: |
        Includes the earlier CSRF endpoint fix from pataar/ha-bambulab at e4520a779be8a1c97dc2a2b00293c68afa8ae0aa and a targeted email verification routing fix.

        Selecting Request new code now switches both initial setup and integration options to the email/SMS verification form and submits the received code through the matching login flow. Authenticator-app TOTP verification continues through its existing flow when a replacement code is not requested.

        Retains the corrected /api/csrf endpoint and the existing print-start trigger.

        bambu_lab.zip contains the integration files at its root, including the frontend bundle, with manifest version 2.2.26.post2. Extract into config/custom_components/bambu_lab/ for manual installation.

        The upstream pybambu test suite and setup/options login-routing regression tests must pass before publication. Packaging checks verify tracked file inclusion, archived file contents, manifest version, ZIP integrity, Python syntax, the CSRF endpoint, and the print-start trigger. No live Home Assistant or Bambu Cloud login test was performed.
    steps:
      - name: 🛍️ Checkout the repo
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run pybambu and login-routing regression tests
        run: python -m pytest tests/pybambu tests/test_config_flow_code_request.py -v

      - name: 📝 Update manifest version
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path("custom_components/bambu_lab/manifest.json")
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          content, count = re.subn(r'("version"\s*:\s*)"[^"]*"',
              lambda match: match[1] + json.dumps(version), path.read_text())
          assert count == 1, "Expected exactly one manifest version"
          path.write_text(content)
          PY

      - name: 🤐 Copy and Zip
        run: |
          cd custom_components/bambu_lab
          zip bambu_lab.zip -r ./

      - name: Validate release archive
        run: |
          python - <<'PY'
          import ast, json, os, subprocess, zipfile
          from pathlib import Path

          root = Path("custom_components/bambu_lab")
          prefix = root.as_posix() + "/"
          tracked = subprocess.check_output(["git", "ls-files", "-z", "--", prefix]).decode().split("\0")
          expected = {name.removeprefix(prefix) for name in tracked if name}
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          with zipfile.ZipFile(root / "bambu_lab.zip") as archive:
              assert archive.testzip() is None, "ZIP CRC failure"
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
              assert len(names) == len(expected) and set(names) == expected, "ZIP file list differs from tracked integration files"
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["domain"] == "bambu_lab" and manifest["version"] == version
              for name in names:
                  data = archive.read(name)
                  assert data == (root / name).read_bytes(), name
                  if name.endswith(".py"):
                      ast.parse(data, filename=name)
              assert archive.read("frontend/ha-bambulab-cards.js"), "Missing frontend bundle"
              if version == "2.2.26.post2":
                  assert len(names) == 95, "Unexpected patch release file count"
                  constants = archive.read("pybambu/const.py")
                  assert b"https://bambulab.com/api/csrf" in constants
                  assert b"https://bambulab.com/api/sign-in/csrf" not in constants
                  assert b"event_print_started" in archive.read("device_trigger.py")
          print(f"Validated {len(names)} integration files for {version}")
          PY

      # This action stages new ordinary releases as drafts, uploads assets, then publishes.
      - name: ☁️ Upload zip to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'push' && 'v2.2.26.post2 — Bambu Cloud email login fix' || github.event.release.name }}
          body: ${{ github.event_name == 'push' && env.PATCH_RELEASE_NOTES || github.event.release.body }}
          fail_on_unmatched_files: true
          files: "${{ github.workspace }}/custom_components/bambu_lab/bambu_lab.zip"
